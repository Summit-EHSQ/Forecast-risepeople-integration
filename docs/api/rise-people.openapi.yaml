  /employee_codes/next:
    get:
      operationId: v1GetNextEmployeeCode
      x-rise-scope: ["employees:read"]
      summary: Suggest the next employee code
      tags: [Employees]
      description: >
        Returns an employee code to suggest for the next new hire in the
        organization, for pre-filling a form. The suggestion is never a code
        another employee already has, but not every numbering scheme is handled.


        To build it, Rise takes the most recently added employee's code and
        either appends a digit to it ("A" -> "A1") or
        increments a code that already ends with a number ("A1" -> "A2"). If the
        result already belongs to an employee, it keeps increasing the number at
        the end until it finds a code that isn't taken. Codes that belong to
        cancelled onboardings are not counted as taken. An organization with no
        employee codes yet gets the code `"1"`.


        The suggested code is not reserved: two requests made before either new
        hire is saved receive the same value.
      security:
        - BearerAuth: ["employees:read"]
      responses:
        '200':
          description: The suggested code.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NextEmployeeCodeDocument'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

