openapi: 3.1.0

info:
  title: Rise People Directory API
  version: 1.0.0
  description: |
    Read and manage the people records that Rise holds for your organization.

    ## Authentication

    Every request must include an OAuth 2.0 access token in the `Authorization`
    header. A token is scoped to a single organization and to the set of
    operations its client is entitled to call.

    ## Errors

    A failure arrives in one of two bodies, and the `Content-Type` of the
    response tells you which one you got.

    * An `application/json` body has an `errors` array. Each entry has a stable
      machine-readable `code` and a human-readable `detail`. A request that
      breaks several rules at once reports all of them in one response.
    * An `application/problem+json` body is an RFC 7807 problem document.

    Both are documented below as the `Error` and `ProblemDetails` schemas. A
    given status code may arrive as either, so branch on `Content-Type` rather
    than on the status alone. Error responses do not negotiate `Accept`: a
    request that asked for `application/json` can still receive
    `application/problem+json`.

    Every response includes an `X-Request-Id` header. Quote it when reporting a
    problem.

    The `code` values an `errors` entry can have:

    | Status | Code | Meaning |
    |---|---|---|
    | 400 | `invalid_params` | A parameter or body member is unknown, missing, or the wrong shape. |
    | 400 | `key_not_included_in_url` | The `id` in the body does not match the id in the path. |
    | 401 | `unauthorized` | The access token is missing or not valid. |
    | 403 | `forbidden` | The caller is not permitted to perform this operation. |
    | 403 | `field_not_permitted` | The request changes an attribute the caller may not change. |
    | 403 | `payroll_not_enabled` | Payroll is not enabled for your organization. |
    | 404 | `not_found` | The record does not exist or is not visible to the caller. |
    | 406 | `not_acceptable` | The `Accept` header allows no media type this API can return. |
    | 409 | `employee_already_exists` | An employee with the same first name, last name and employee code exists. |
    | 409 | `effective_date_overlap` | Another change already sets the same thing on that date. |
    | 409 | `already_reversed` | The journey event has already been reversed. |
    | 415 | `unsupported_media_type` | The request body is not sent as `application/json`. |
    | 422 | `validation_failed` | A value breaks one of Rise's rules. |
    | 422 | `duplicate_employee_code` | The employee code is already in use. |
    | 422 | `duplicate_payroll_department_code` | A department's payroll code is already in use in payroll. |
    | 422 | `not_reversible` | The journey event cannot be reversed. |
    | 422 | `payroll_rejected` | Payroll rejected the change, and nothing was changed. |
    | 500 | `internal_error` | An unexpected error. |

    ## Pagination

    List operations are paginated with `page[number]` and `page[size]`, and
    report the total number of matching records in `meta.count`.

servers:
  - url: https://api.risepeople.com/v1
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Employees
    description: >
      The people in your organization: their profiles, and the managers,
      positions, teams, departments and locations they are placed with.
  - name: Journey events
    description: >
      Dated changes to an employee's employment (hire, status, position,
      compensation and manager changes), and their reversal.
  - name: Emergency contacts
    description: >
      The people to reach on an employee's behalf in an emergency.
  - name: Onboarding
    description: >
      New hires being set up before their first day, and their progress
      towards approval.
  - name: Organization
    description: >
      Your organization's structure: teams, departments, positions and the
      payroll organizations it is connected to.

paths:
  /employees:
    get:
      operationId: v1ListEmployees
      x-rise-scope: ["employees:read"]
      summary: List employees
      tags: [Employees]
      description: >
        Returns a page of the people in your organization. Records are ordered
        by last name, then by id. `is_on_leadership_team` orders them by when
        they joined the leadership team instead; the order cannot otherwise be
        changed.


        People who have not finished onboarding are not returned.


        Which attributes appear on a record depends on what the caller is
        permitted to see, so a field documented here may be absent for some
        callers. `id`, `employment_stage` and `is_manager` are always present.


        A caller that is not permitted to view the people directory, or not
        permitted to view other people's profiles, receives only their own
        record.


        This will not return employees whose onboarding isn't completed. Use the
        onboarding operations for this instead.
      security:
        - BearerAuth: ["employees:read"]
      parameters:
        - name: id
          in: query
          required: false
          description: >
            Return only these people. Comma-separated, for example
            `?id=1000,1001`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: integer, minimum: 1 }
            examples: [[1000, 1001]]
        - name: employment_stage
          in: query
          required: false
          description: >
            Return only the people at these stages of employment.
            Comma-separated, for example `?employment_stage=employed,not_employed`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              enum: [awaiting_employment_details, employment_pending, employed, not_employed]
        - name: name_search
          in: query
          required: false
          description: >
            Match against first, last and common name. First and last names
            are searched only when the caller is permitted to read them across
            the organization; common names are always searched.
          schema: { type: string, minLength: 1, maxLength: 100, examples: ['Aaronson'] }
        - name: smart_search
          in: query
          required: false
          description: >
            Match against name, employee code, and position, team and
            department names.
          schema: { type: string, minLength: 1, maxLength: 100, examples: ['Engineering'] }
        - name: is_on_leadership_team
          in: query
          required: false
          description: >
            Return only the people on the leadership team. The only accepted
            value is true; omit the parameter to return everyone. This filter
            re-orders employees by the date when they were added to the
            leadership team.
          schema:
            type: boolean
            enum: [true]
        - name: groups
          in: query
          required: false
          description: >
            Which kinds of primary group `within_primary_groups_of` compares.
            Has no effect on its own. Defaults to all three. Comma-separated,
            for example `?groups=teams,departments`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 3
            uniqueItems: true
            items:
              type: string
              enum: [teams, departments, locations]
        - name: within_primary_groups_of
          in: query
          required: false
          description: >
            Return the members of this person's primary groups, including them,
            whether or not those groups are primary for the other members. Use
            `groups` to choose which kinds of group count. If the person has no
            primary group of those kinds, everyone who belongs to any team,
            department or location is returned. This filter looks the person up
            first, so an id that does not exist, or that the caller is not
            permitted to see, returns 404. The other filters return an empty
            page for such an id.
          schema: { type: integer, minimum: 1, examples: [1000] }
        - name: within_teams_of
          in: query
          required: false
          description: >
            Return the people who share a team with this person, excluding
            them.
          schema: { type: integer, minimum: 1, examples: [1000] }
        - name: within_departments_of
          in: query
          required: false
          description: >
            Return the people who share a department with this person,
            excluding them.
          schema: { type: integer, minimum: 1, examples: [1000] }
        - name: manager_id
          in: query
          required: false
          description: Return the people managed by this person.
          schema: { type: integer, minimum: 1, examples: [1000] }
        - name: group_lead_id
          in: query
          required: false
          description: >
            Return the people in a team, department or location this person
            leads. Includes the leader.
          schema: { type: integer, minimum: 1, examples: [1000] }
        - name: leader_type
          in: query
          required: false
          description: >
            Return only the people who lead others in these ways.
            Comma-separated, for example `?leader_type=manager,group_lead`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 2
            uniqueItems: true
            items:
              type: string
              enum: [manager, group_lead]
        - name: organization_position_id
          in: query
          required: false
          description: >
            Return only the people currently holding these positions. Position
            ids can be looked up with `GET /organization_positions`.
            Comma-separated, for example `?organization_position_id=500,501`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: integer, minimum: 1 }
            examples: [[500, 501]]
        - name: page[number]
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: page[size]
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: A page of employees.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      operationId: v1CreateEmployee
      x-rise-scope: ["employees:write"]
      summary: Create an employee
      description: >
        Creates one person in your organization, hired effective `start_date`,
        and returns their record: their `employment_stage` is `employed`, or
        `employment_pending` if the date is in the future.


        The body you send and the record you get back are different documents.
        The body is an `EmployeeCreateRequest`, which places the person with
        lists of team, location, department and manager ids and a position name.
        The record returned is an `Employee`, which reports that placement as
        its `primary_*` attributes: the first id in each list becomes the
        primary one.


        Sending `payroll_organization_id` also enrols the person in that payroll
        organization. `department_ids`, `government_identifier_number`,
        `date_of_birth`, `gender` and the home address (`address_line_one`,
        `city`, `postal_code`, `country_code`, `region_code`) are then required,
        `country_code` and `country_code_of_employment` must both be `CA`, and
        `compensation_method` and `pay_rate` cannot be sent. If payroll is not
        enabled for your organization, the request fails with 403 and the code
        `payroll_not_enabled`. If payroll rejects the request, nothing is
        created and the request fails with 422 and the code `payroll_rejected`.


        Creating an employee whose first name, last name and employee code all
        match a person your organization already has fails with 409.


        The address `preferred_email_type` names is the one the person will
        sign in with. If it is already someone's sign-in address, the request
        is refused with 422, naming the field that holds it.


        The returned record includes only the attributes the caller is permitted
        to read.
      tags: [Employees]
      security:
        - BearerAuth: ["employees:write"]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: The employee that was created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
        '400': { $ref: '#/components/responses/WriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >
            Either an employee with the same first name, last name and employee
            code already exists (an `Error` body with the code
            `employee_already_exists`), or the `Idempotency-Key` sent with this
            request was already used with a different payload (a
            `ProblemDetails` body). `Content-Type` tells the two apart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: >
            The employee was not created. A value is invalid, a required field
            is missing, or the login email address is already in use
            (`validation_failed`); payroll rejected the request
            (`payroll_rejected`); or one of the person's departments could not
            be set up in payroll because its payroll department code is already
            in use there (`duplicate_payroll_department_code`). The `errors`
            array names what was rejected.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /employees/{employee_id}:
    get:
      operationId: v1GetEmployee
      x-rise-scope: ["employees:read"]
      summary: Get an employee
      tags: [Employees]
      description: >
        Returns one person in your organization: their identity, contact details
        and employment status, plus their primary position, manager, team,
        department and location as identifiers with names alongside. The record
        has the same shape as a record from the employees list.


        Which attributes appear depends on what the caller is permitted to see
        for this person, so a field documented here may be absent for some
        callers. `id`, `employment_stage` and `is_manager` are always present.


        Unlike the employees list, this operation returns people who have not
        finished onboarding, when the caller is permitted to see them. Use `GET
        /onboardings` to discover the ids of onboarding employees.


        Returns 404 for a person who does not exist, belongs to another
        organization, or is not visible to the caller. A caller that is not
        permitted to view the people directory, or not permitted to view other
        people's profiles, can read only their own record.
      security:
        - BearerAuth: ["employees:read"]
      parameters:
        - name: employee_id
          in: path
          required: true
          description: Identifier of the employee to return.
          schema: { type: integer, minimum: 1, examples: [1000] }
      responses:
        '200':
          description: The employee.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: v1UpdateEmployee
      x-rise-scope: ["employees:write"]
      summary: Update an employee
      description: >
        Changes one or more attributes of one person in your organization and
        returns their record. Attributes absent from the request are left
        unchanged; send `null` to clear an attribute that allows it. A person's
        teams, locations, departments, managers, positions, compensation and
        payroll enrolment cannot be changed with this operation, but which of
        their existing managers, departments, teams, locations and position
        assignments is primary can be. Naming a primary the person does not
        already have fails with 422 and the code `validation_failed`.


        Which attributes the caller may change depends on whose record it is:
        the caller's own, someone who reports to them, or anyone else.
        `primary_manager_id` and `primary_position_id` follow the same rule,
        using the permission to edit a person's journey. Four attributes are
        organization-level instead, so whose record it is does not matter:
        `is_on_leadership_team` needs the organization-information permission,
        and `primary_department_id`, `primary_team_id` and `primary_location_id`
        need permission to edit the organization's departments, teams and
        locations respectively. A request that includes an attribute the caller
        may not change for this person fails with 403 and the code
        `field_not_permitted`, naming the attributes, and nothing is changed.


        Depending on the caller's permissions, a change to some attributes needs
        approval before it takes effect. Such a change is submitted to your
        organization's approvers instead of being applied: the request still
        succeeds and the returned record shows the value from before the change.
        The other attributes in the same request are applied immediately.


        When the person is enrolled in payroll, the change is sent to payroll as
        well. If payroll is not enabled for your organization, the request fails
        with 403 and the code `payroll_not_enabled`. If payroll rejects the
        change, nothing is changed and the request fails with 422 and the code
        `payroll_rejected`.


        Returns 404 for a person who does not exist, belongs to another
        organization, or is not visible to the caller. The returned record
        includes only the attributes the caller is permitted to read.


        For a person who has not finished onboarding, `home_email` and
        `work_email` cannot be updated with this endpoint: a request that
        includes them fails with 403 and the code `field_not_permitted`. Update
        these via Rise's web frontend instead.
      tags: [Employees]
      security:
        - BearerAuth: ["employees:write"]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: employee_id
          in: path
          required: true
          description: Identifier of the employee to update.
          schema: { type: integer, minimum: 1, examples: [1000] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: The employee after the update.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EmployeeDocument'
        '400': { $ref: '#/components/responses/WriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: >
            The employee was not changed. A value is invalid, or payroll
            rejected the change. The `errors` array names what was rejected.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /employees/{employee_id}/managers:
    get:
      operationId: v1ListEmployeeManagers
      x-rise-scope: ["employees:read"]
      summary: List an employee's managers
      description: >
        Returns the people one employee currently reports to. Managers are
        employees, so each record has the same shape and the same
        permission-dependent attributes as a record from the employees list.
        Records are ordered by id. Returns 404 for an employee that does not
        exist or is not visible to the caller. A manager the caller is not
        permitted to see is left out of the page. A caller can always read their
        own managers, even without the permissions needed to list other people;
        each manager record still includes only the fields the caller may view.
      tags: [Employees]
      security:
        - BearerAuth: ["employees:read"]
      parameters:
        - name: employee_id
          in: path
          required: true
          description: Identifier of the employee whose managers to list.
          schema: { type: integer, minimum: 1 }
        - name: page[number]
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: page[size]
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: A page of the employee's managers.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /onboardings:
    get:
      operationId: v1ListOnboardings
      x-rise-scope: ["employees:read"]
      summary: List onboardings
      tags: [Onboarding]
      description: >
        Returns a page of onboarding records, one per new hire, ordered by
        id. Requires permission to manage onboarding.
      security:
        - BearerAuth: ["employees:read"]
      parameters:
        - name: id
          in: query
          required: false
          description: >
            Return only these onboardings. Comma-separated, for example
            `?id=4821,4822`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: integer, minimum: 1 }
            examples: [[4821, 4822]]
        - name: status
          in: query
          required: false
          description: >
            Return only the onboardings at these statuses. Comma-separated,
            for example `?status=invitation_sent,in_progress`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 7
            uniqueItems: true
            items:
              type: string
              enum:
                - not_yet_invited
                - invitation_sent
                - in_progress
                - new_hire_completed
                - hr_approved
                - onboarded
                - cancelled
        - name: name_search
          in: query
          required: false
          description: Match against the new hire's first, last and common name.
          schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[^,]+$', examples: ['Aaronson'] }
        - name: smart_search
          in: query
          required: false
          description: >
            Match against the new hire's names, their current position title
            and their department names.
          schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[^,]+$', examples: ['Engineering'] }
        - name: start_date_from
          in: query
          required: false
          description: Return only new hires starting on or after this date.
          schema: { type: string, format: date, examples: ['2026-10-01'] }
        - name: start_date_to
          in: query
          required: false
          description: Return only new hires starting on or before this date.
          schema: { type: string, format: date, examples: ['2026-10-31'] }
        - name: page[number]
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: page[size]
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: A page of onboardings.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/OnboardingList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      operationId: v1CreateOnboarding
      x-rise-scope: ["employees:write"]
      summary: Start onboarding a new hire
      description: >
        Creates an employee for a new hire, in the `in_onboarding` stage,
        together with an onboarding record that tracks their setup before their
        first day, and returns the onboarding. Everything in the request is
        created together or not at all.


        Through onboarding, new hires can enter their own details and access the
        platform before their first day. To create an employee without these
        extra features, use `POST /employees`.


        An employee code already in use in your organization fails with 422 and
        the code `duplicate_employee_code`, and the error names a code that is
        free. A `home_email`, or a `work_email` when `preferred_email_type` is
        `work_email`, that already belongs to a user fails with 422, and the
        error names the field. Requires permission to manage onboarding, and an
        organization with the onboarding feature.
      tags: [Onboarding]
      security:
        - BearerAuth: ["employees:write"]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingCreateRequest'
      responses:
        '201':
          description: The onboarding that was created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/OnboardingDocument'
        '400': { $ref: '#/components/responses/WriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /employees/{employee_id}/journey_events:
    get:
      operationId: v1ListEmployeeJourneyEvents
      x-rise-scope: ["employees:read"]
      summary: List an employee's journey events
      description: >
        Returns one employee's employment history (hire, status, position,
        compensation and manager changes), newest effective date first.
        `event_data` holds what an event changed and `previous_event_data` the
        values before it; the keys present depend on `event_name`. Events the
        caller may not see are left out without an error, so a page can be
        empty. Returns 404 for an unknown or invisible employee.
      tags: [Journey events]
      security:
        - BearerAuth: ["employees:read"]
      parameters:
        - name: employee_id
          in: path
          required: true
          description: Identifier of the employee whose journey events are listed.
          schema: { type: integer, minimum: 1 }
        - name: page[number]
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: page[size]
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: A page of the employee's journey events.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JourneyEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      operationId: v1CreateEmployeeJourneyEvent
      x-rise-scope: ["employees:write"]
      summary: Record a journey event for an employee
      description: >
        Records one dated change to the employee's positions or managers and
        returns the journey event it created. `command` selects the change:
        `change_employment_position` sets the employee's positions,
        `change_employee_managers` sets their managers, and `promote_employee`
        sets the positions and, optionally, the managers as a single event. A
        `change_employee_managers` replaces the managers that an earlier hire,
        manager change or promotion set on the same date. Compensation is not
        changed. The request fails with 422 for an employee whose onboarding is
        in progress or cancelled. To undo a journey event, use `POST
        /journey_events/{journey_event_id}/reversal`.
      tags: [Journey events]
      security:
        - BearerAuth: ["employees:write"]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: employee_id
          in: path
          required: true
          description: Identifier of the employee the event is recorded for.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JourneyEventPositionChangeRequest'
                - $ref: '#/components/schemas/JourneyEventManagersChangeRequest'
                - $ref: '#/components/schemas/JourneyEventPromotionRequest'
              discriminator:
                propertyName: command
                mapping:
                  change_employment_position: '#/components/schemas/JourneyEventPositionChangeRequest'
                  change_employee_managers: '#/components/schemas/JourneyEventManagersChangeRequest'
                  promote_employee: '#/components/schemas/JourneyEventPromotionRequest'
      responses:
        '201':
          description: The journey event that was recorded.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JourneyEventDocument'
        '204':
          description: >
            Nothing new was recorded, and there is no response body. A
            `change_employee_managers` with an empty `manager_ids` first undoes
            the managers already set on `effective_date`, including by a
            promotion or hire. If the employee is then left with no managers on
            that date, nothing new is recorded and this status is returned.
        '400': { $ref: '#/components/responses/WriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >
            Code `effective_date_overlap`: another change already sets the
            employee's positions or managers on `effective_date`, and this
            command cannot replace it. Otherwise, the `Idempotency-Key` sent
            with this request was already used with a different payload.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /journey_events/{journey_event_id}/reversal:
    post:
      operationId: v1ReverseJourneyEvent
      x-rise-scope: ["employees:write"]
      summary: Reverse a journey event
      description: >
        Undoes one journey event by recording a reversal against it, and returns
        that reversal. The employee's positions or managers go back to what they
        would have been had the event never been recorded. Position changes,
        manager changes and promotions can be reversed, unless they changed
        compensation. Returns 404 for an event that is unknown or that the
        caller may not see.
      tags: [Journey events]
      security:
        - BearerAuth: ["employees:write"]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: journey_event_id
          in: path
          required: true
          description: Identifier of the journey event to reverse.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        description: The body may be omitted. If sent, it is an empty JSON object.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyEventReversalRequest'
      responses:
        '201':
          description: The reversal that was recorded.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/JourneyEventReversalDocument'
        '400': { $ref: '#/components/responses/WriteBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: >
            Code `already_reversed`: the event has already been reversed.
            Otherwise, the `Idempotency-Key` sent with this request was already
            used with a different payload.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: >
            Code `not_reversible`: the event is not a position change, a manager
            change or a promotion, or it changed compensation. Code
            `payroll_rejected`: payroll rejected the change, and nothing was
            reversed. Code `validation_failed`: the employee's onboarding is in
            progress or cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /onboardings/{onboarding_id}:
