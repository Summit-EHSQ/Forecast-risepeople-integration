        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }


  /employees/{employee_id}/departments:
    get:
      operationId: v1ListEmployeeDepartments
      x-rise-scope: ["employees:read"]
      summary: List an employee's departments
      description: >
        Returns the departments one employee belongs to, as a member or as a
        lead. Records are ordered by id. Reading another employee's departments
        takes the departments permission, or either of the time-off permissions
        to access time-off reports or to manage time-off policies and reviewers.
