  /employees/{employee_id}/compliance_record:
    get:
      operationId: v1GetEmployeeComplianceRecord
      x-rise-scope: ["employee_compliance:read"]
      summary: Get an employee's compliance record
      description: >
        Returns the compliance record for one employee: their government
        identifier (a Canadian SIN or a US SSN) and, for employees working in
        the United States, their FLSA exemption and EEO demographics. An
        employee has at most one compliance record, so `data` is a single
        record, and it is null for an employee who has none.


        One permission covers the whole record. A caller who may view an
        employee's government identifier sees every field on it, and any other
        caller is answered 403. The permission is granted separately for the
        caller's own record, their direct reports' records, and everyone
        else's. Reading another employee's record also needs permission to
        view the people list and employee profiles. Without both, any employee
        other than the caller answers 404, the same as an employee that does
        not exist.
      tags: [Employees]
      security:
        - BearerAuth: ["employee_compliance:read"]
      parameters:
        - name: employee_id
          in: path
          required: true
          description: Identifier of the employee whose compliance record is returned.
          schema: { type: integer }
      responses:
        '200':
          description: The employee's compliance record, or null when they have none.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EmployeeComplianceRecordDocument'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
